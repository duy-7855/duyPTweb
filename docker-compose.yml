services:

  nginx:
    image: nginx:latest
    container_name: mon_ptweb_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - nodered

  nodered:
    image: nodered/node-red:latest
    container_name: mon_ptweb_nodered
    restart: unless-stopped
    ports:
      - "1881:1880"
    volumes:
      - ./nodered:/data

  mariadb:
    image: mariadb:latest
    container_name: mon_ptweb_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3300:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mon_ptweb_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mariadb

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mon_ptweb_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  mariadb_data:
